<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TM Learning</title>
  <style>
    :root { --bd:#ddd; --bg:#fafafa; --ok:#2e7d32; --bad:#c62828; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif; margin: 20px; }
    h1 { margin: 0 0 10px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .card { border:1px solid var(--bd); border-radius:12px; padding:14px; background: #fff; }
    .muted { color:#666; font-size:14px; }
    input, select, button { padding:8px 10px; border:1px solid var(--bd); border-radius:10px; font-size:14px; }
    button { cursor:pointer; background:#fff; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .section { margin-top: 14px; }
    .pill { display:inline-block; padding:2px 8px; border:1px solid var(--bd); border-radius:999px; font-size:12px; color:#444; background:var(--bg); }
    .list { margin:10px 0 0; padding:0; list-style:none; }
    .list li { border:1px solid var(--bd); border-radius:12px; padding:10px 12px; margin-top:8px; background:#fff; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; color:#444; }
    .choiceBtn { display:block; width:100%; text-align:left; padding:10px 12px; margin-top:8px; border:1px solid var(--bd); border-radius:12px; background:#fff; }
    .choiceBtn.good { border:2px solid var(--ok); background:#e8f5e9; }
    .choiceBtn.bad { border:2px solid var(--bad); background:#ffebee; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width: 900px){ .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>TM Learning</h1>
  <div class="muted">資料來源：<span class="mono">index.json</span>（教材 decks + 日文小遊戲題庫）</div>

  <div id="status" class="section card">
    <div class="row">
      <span class="pill">Status</span>
      <span id="statusText" class="muted">載入中…</span>
      <button id="reloadBtn" style="margin-left:auto;">重新載入</button>
    </div>
    <div id="statusDetail" class="muted" style="margin-top:8px;"></div>
  </div>

  <div class="grid2 section">
    <!-- Left: Search -->
    <section class="card">
      <div class="row">
        <h2 style="margin:0;">教材查詢</h2>
        <span class="pill" id="countPill">0 sentences</span>
      </div>

      <div class="row section">
        <input id="q" type="text" placeholder="輸入關鍵字（支援英文/中文）" style="flex:1; min-width:260px;" />
        <select id="deckFilter" title="Deck 篩選">
          <option value="ALL">全部 decks</option>
        </select>
        <button id="searchBtn">搜尋</button>
        <button id="clearBtn">清除</button>
      </div>

      <div id="searchHint" class="muted section">提示：會在所有 decks/slides 的 <span class="mono">sentences</span> 內搜尋。</div>
      <ul id="results" class="list"></ul>
    </section>

    <!-- Right: Slide Viewer -->
    <section class="card">
      <div class="row">
        <h2 style="margin:0;">投影片瀏覽</h2>
        <span class="pill" id="slidePill">-</span>
      </div>

      <div class="row section">
        <select id="deckSel" style="flex:1; min-width:280px;">
          <option value="">選擇 deck…</option>
        </select>
        <select id="slideSel" style="min-width:160px;">
          <option value="">選擇 slide…</option>
        </select>
      </div>

      <div id="slideTitle" class="section" style="font-weight:700;"></div>
      <div id="slideMeta" class="muted"></div>
      <ul id="slideSentences" class="list"></ul>
    </section>
  </div>

  <!-- Game -->
  <section class="card section" id="jpGame">
    <div class="row">
      <h2 style="margin:0;">日文用法小遊戲</h2>
      <div class="row" style="margin-left:auto;">
        <label class="muted">關卡</label>
        <select id="jpGroup">
          <option value="ALL">全部</option>
        </select>
        <button id="jpStart">開始</button>
        <button id="jpNext" disabled>下一題</button>
      </div>
    </div>

    <div class="row section muted" style="gap:16px;">
      <div>分數：<b id="jpScore">0</b></div>
      <div>連續答對：<b id="jpStreak">0</b></div>
      <div>題號：<b id="jpIdx">-</b></div>
    </div>

    <div id="jpCard" class="section" style="padding:14px; border-radius:12px; background:var(--bg);">
      <div class="muted">按「開始」出題</div>
    </div>
  </section>

<script>
(() => {
  // -------------------------
  // Data loading
  // -------------------------
  const $ = (id) => document.getElementById(id);

  const state = {
    data: null,
    sentenceIndex: [], // {deckIdx, slideIdx, deckName, slideNo, title, sentence}
    jpBank: [],
    jpGroups: [],
    jp: { order: [], cursor: 0, score: 0, streak: 0, current: null, locked: false }
  };

  function setStatus(text, detail = "", isError = false){
    $("statusText").textContent = text;
    $("statusText").style.color = isError ? "#c62828" : "#666";
    $("statusDetail").textContent = detail || "";
  }

  function safeText(v){
    if (v === null || v === undefined) return "";
    return String(v);
  }

  function flattenSentences(data){
    const idx = [];
    const decks = Array.isArray(data?.decks) ? data.decks : [];
    decks.forEach((deck, di) => {
      const deckName = safeText(deck.source_file || `deck_${di+1}`);
      const slides = Array.isArray(deck.slides) ? deck.slides : [];
      slides.forEach((s, si) => {
        const slideNo = s.slide ?? (si+1);
        const title = safeText(s.title_guess || "");
        const sentences = Array.isArray(s.sentences) ? s.sentences : [];
        sentences.forEach((line) => {
          if (!line) return;
          idx.push({
            deckIdx: di,
            slideIdx: si,
            deckName,
            slideNo,
            title,
            sentence: safeText(line)
          });
        });
      });
    });
    return idx;
  }

  function buildDeckOptions(){
    const decks = state.data.decks || [];
    const deckSel = $("deckSel");
    const deckFilter = $("deckFilter");
    deckSel.innerHTML = `<option value="">選擇 deck…</option>`;
    deckFilter.innerHTML = `<option value="ALL">全部 decks</option>`;

    decks.forEach((d, i) => {
      const name = safeText(d.source_file || `deck_${i+1}`);
      const opt1 = document.createElement("option");
      opt1.value = String(i);
      opt1.textContent = name;
      deckSel.appendChild(opt1);

      const opt2 = document.createElement("option");
      opt2.value = String(i);
      opt2.textContent = name;
      deckFilter.appendChild(opt2);
    });
  }

  function buildSlideOptions(deckIdx){
    const slideSel = $("slideSel");
    slideSel.innerHTML = `<option value="">選擇 slide…</option>`;
    if (deckIdx === "" || deckIdx === null || deckIdx === undefined) return;

    const deck = state.data.decks[Number(deckIdx)];
    const slides = Array.isArray(deck?.slides) ? deck.slides : [];
    slides.forEach((s, si) => {
      const slideNo = s.slide ?? (si+1);
      const opt = document.createElement("option");
      opt.value = String(si);
      opt.textContent = `Slide ${slideNo}`;
      slideSel.appendChild(opt);
    });
  }

  function renderSlide(deckIdx, slideIdx){
    const decks = state.data.decks || [];
    const deck = decks[Number(deckIdx)];
    const slides = deck?.slides || [];
    const s = slides[Number(slideIdx)];
    if (!s) {
      $("slideTitle").textContent = "";
      $("slideMeta").textContent = "";
      $("slideSentences").innerHTML = "";
      $("slidePill").textContent = "-";
      return;
    }

    const deckName = safeText(deck.source_file || "");
    const slideNo = s.slide ?? (Number(slideIdx)+1);
    const title = safeText(s.title_guess || "");
    const sentences = Array.isArray(s.sentences) ? s.sentences : [];

    $("slidePill").textContent = `${deckName} / Slide ${slideNo}`;
    $("slideTitle").textContent = title ? title : "(no title_guess)";
    $("slideMeta").textContent = `sentences: ${sentences.length}`;

    $("slideSentences").innerHTML = sentences.map(t => `
      <li>
        <div>${escapeHtml(safeText(t))}</div>
      </li>
    `).join("");
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // -------------------------
  // Search
  // -------------------------
  function doSearch(){
    const q = $("q").value.trim().toLowerCase();
    const deckFilterVal = $("deckFilter").value;

    const results = [];
    if (!q){
      $("results").innerHTML = `<li class="muted">請先輸入關鍵字。</li>`;
      return;
    }

    for (const row of state.sentenceIndex){
      if (deckFilterVal !== "ALL" && String(row.deckIdx) !== deckFilterVal) continue;
      if (row.sentence.toLowerCase().includes(q)){
        results.push(row);
        if (results.length >= 80) break; // 避免爆量（可自行調整）
      }
    }

    if (!results.length){
      $("results").innerHTML = `<li class="muted">沒有找到符合的句子。</li>`;
      return;
    }

    $("results").innerHTML = results.map(r => `
      <li>
        <div class="muted" style="margin-bottom:4px;">
          <span class="pill">${escapeHtml(r.deckName)}</span>
          <span class="pill">Slide ${escapeHtml(r.slideNo)}</span>
          ${r.title ? `<span class="pill">${escapeHtml(r.title.slice(0,60))}${r.title.length>60?"…":""}</span>` : ""}
        </div>
        <div>${escapeHtml(r.sentence)}</div>
        <div class="row" style="margin-top:8px;">
          <button data-jump="${r.deckIdx}:${r.slideIdx}">跳到此 slide</button>
        </div>
      </li>
    `).join("");

    // Jump handlers
    $("results").querySelectorAll("button[data-jump]").forEach(btn => {
      btn.addEventListener("click", () => {
        const [di, si] = btn.dataset.jump.split(":").map(Number);
        $("deckSel").value = String(di);
        buildSlideOptions(di);
        $("slideSel").value = String(si);
        renderSlide(di, si);
        window.scrollTo({ top: $("jpGame").offsetTop - 20, behavior: "smooth" });
      });
    });
  }

  // -------------------------
  // JP Game
  // -------------------------
  function shuffle(a){
    const x = a.slice();
    for (let i=x.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [x[i],x[j]]=[x[j],x[i]];
    }
    return x;
  }

  function buildJpGroupOptions(){
    const sel = $("jpGroup");
    sel.innerHTML = `<option value="ALL">全部</option>`;
    state.jpGroups.forEach(g => {
      const opt = document.createElement("option");
      opt.value = g;
      opt.textContent = g;
      sel.appendChild(opt);
    });
  }

  function jpFilterBank(group){
    const bank = Array.isArray(state.jpBank) ? state.jpBank : [];
    if (group === "ALL") return bank;
    return bank.filter(q => q.group === group);
  }

  function jpRenderQuestion(){
    const card = $("jpCard");
    $("jpNext").disabled = true;
    state.jp.locked = false;

    if (state.jp.cursor >= state.jp.order.length){
      $("jpIdx").textContent = "-";
      card.innerHTML = `
        <div style="font-weight:800;">本輪結束！</div>
        <div class="muted" style="margin-top:6px;">總分：<b>${state.jp.score}</b>｜連續答對：<b>${state.jp.streak}</b></div>
        <div class="muted" style="margin-top:10px;">可換關卡或再按「開始」重玩。</div>
      `;
      return;
    }

    const q = state.jp.current = state.jpBankFiltered[state.jp.order[state.jp.cursor]];
    $("jpIdx").textContent = `${state.jp.cursor+1}/${state.jp.order.length}`;

    const choicesHtml = (q.choices_ja || []).map((c, idx) => `
      <button class="choiceBtn" data-idx="${idx}">${escapeHtml(c)}</button>
    `).join("");

    card.innerHTML = `
      <div style="font-weight:700;">題目（中文）</div>
      <div style="margin-top:6px;">${escapeHtml(q.prompt_zh || "")}</div>
      <div class="muted" style="margin-top:10px;">選擇最正確的日文：</div>
      <div style="margin-top:6px;">${choicesHtml}</div>
      <div id="jpFb" class="muted" style="margin-top:10px;"></div>
    `;

    card.querySelectorAll(".choiceBtn").forEach(btn => {
      btn.addEventListener("click", () => jpChoose(btn));
    });
  }

  function jpStart(){
    const group = $("jpGroup").value;
    const bankFiltered = jpFilterBank(group);

    if (!bankFiltered.length){
      $("jpCard").innerHTML = `<div style="color:var(--bad); font-weight:800;">此關卡沒有題目，請先在 index.json 補上 jp_usage_game_bank。</div>`;
      return;
    }

    state.jpBankFiltered = bankFiltered;
    state.jp.order = shuffle([...Array(bankFiltered.length).keys()]);
    state.jp.cursor = 0;
    state.jp.score = 0;
    state.jp.streak = 0;
    $("jpScore").textContent = "0";
    $("jpStreak").textContent = "0";
    jpRenderQuestion();
  }

  function jpChoose(btn){
    if (state.jp.locked) return;
    state.jp.locked = true;

    const q = state.jp.current;
    const idx = Number(btn.dataset.idx);
    const ok = idx === Number(q.answer_index);
    const fb = $("jpFb");
    const all = $("jpCard").querySelectorAll(".choiceBtn");

    all.forEach(b => b.disabled = true);

    all.forEach(b => {
      const bi = Number(b.dataset.idx);
      if (bi === Number(q.answer_index)) b.classList.add("good");
      else if (bi === idx && !ok) b.classList.add("bad");
      else b.style.opacity = "0.85";
    });

    if (ok){
      state.jp.score += 10;
      state.jp.streak += 1;
      fb.innerHTML = `<span style="color:var(--ok); font-weight:800;">✅ 正確！+10</span><div style="margin-top:6px;">${escapeHtml(q.explain_zh || "")}</div>`;
    } else {
      state.jp.streak = 0;
      fb.innerHTML = `<span style="color:var(--bad); font-weight:800;">❌ 錯誤</span><div style="margin-top:6px;">${escapeHtml(q.explain_zh || "")}</div>`;
    }

    $("jpScore").textContent = String(state.jp.score);
    $("jpStreak").textContent = String(state.jp.streak);
    $("jpNext").disabled = false;
  }

  function jpNext(){
    state.jp.cursor += 1;
    jpRenderQuestion();
  }

  // -------------------------
  // Init
  // -------------------------
  async function load(){
    try{
      setStatus("載入中…", "正在讀取 index.json");
      const url = `index.json?v=${Date.now()}`; // cache-bust
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      // Basic validation
      if (!data || !Array.isArray(data.decks)) {
        throw new Error("index.json 缺少 decks（或 decks 不是陣列）");
      }

      state.data = data;
      state.sentenceIndex = flattenSentences(data);

      // JP game bank
      state.jpBank = Array.isArray(data.jp_usage_game_bank) ? data.jp_usage_game_bank : [];
      state.jpGroups = [...new Set(state.jpBank.map(x => x.group).filter(Boolean))].sort();

      $("countPill").textContent = `${state.sentenceIndex.length} sentences`;

      buildDeckOptions();
      buildJpGroupOptions();

      setStatus("載入完成", `decks: ${data.decks.length}｜sentences: ${state.sentenceIndex.length}｜jp questions: ${state.jpBank.length}`);
    } catch (e){
      console.error(e);
      setStatus("載入失敗", String(e?.message || e), true);
    }
  }

  // UI hooks
  $("reloadBtn").addEventListener("click", load);
  $("searchBtn").addEventListener("click", doSearch);
  $("clearBtn").addEventListener("click", () => { $("q").value=""; $("results").innerHTML=""; });
  $("q").addEventListener("keydown", (ev) => { if (ev.key === "Enter") doSearch(); });

  $("deckSel").addEventListener("change", () => {
    const di = $("deckSel").value;
    buildSlideOptions(di);
    renderSlide(di, $("slideSel").value);
  });
  $("slideSel").addEventListener("change", () => {
    renderSlide($("deckSel").value, $("slideSel").value);
  });

  $("jpStart").addEventListener("click", jpStart);
  $("jpNext").addEventListener("click", jpNext);

  // Start
  load();
})();
</script>
</body>
</html>
